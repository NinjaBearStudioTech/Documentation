name: Build documentation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

env:
  INSTANCE: 'Writerside/docsite'
  ARTIFACT: 'webHelpDOCSITE2-all.zip'
  DOCKER_VERSION: '2026.10.0423'
  ALGOLIA_APP_NAME: '1VNI46BYQK'
  ALGOLIA_INDEX_NAME: 'nbs_tech_site_index'
  CONFIG_JSON_PRODUCT: 'docsite'
  CONFIG_JSON_VERSION: '1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      algolia_artifact: ${{ steps.define-ids.outputs.algolia_artifact }}
      artifact: ${{ steps.define-ids.outputs.artifact }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Define instance id and artifacts
        id: define-ids
        run: |
          INSTANCE=${INSTANCE#*/}
          INSTANCE_ID_UPPER=$(echo "$INSTANCE" | tr '[:lower:]' '[:upper:]')
          ARTIFACT="webHelp${INSTANCE_ID_UPPER}2-all.zip"
          ALGOLIA_ARTIFACT="algolia-indexes-${INSTANCE_ID_UPPER}.zip"

          # Print the values
          echo "INSTANCE_ID_UPPER: $INSTANCE_ID_UPPER"
          echo "ARTIFACT: $ARTIFACT"
          echo "ALGOLIA_ARTIFACT: $ALGOLIA_ARTIFACT"

          # Set the environment variables and outputs
          echo "INSTANCE_ID_UPPER=$INSTANCE_ID_UPPER" >> $GITHUB_ENV
          echo "ARTIFACT=$ARTIFACT" >> $GITHUB_ENV
          echo "ALGOLIA_ARTIFACT=$ALGOLIA_ARTIFACT" >> $GITHUB_ENV
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "algolia_artifact=$ALGOLIA_ARTIFACT" >> $GITHUB_OUTPUT

      - name: Replace Algolia Credentials in build profile
        uses: jacobtomlinson/gha-find-replace@v2
        with:
          find: "$ALGOLIA_KEY_MARKER"
          replace: ${{ secrets.ALGOLIA_KEY }}
          regex: false
          include: 'Writerside/cfg/buildprofiles.xml'

      - name: Build docs using Writerside Docker builder
        uses: JetBrains/writerside-github-action@v4
        with:
          instance: ${{ env.INSTANCE }}
          artifact: ${{ env.ARTIFACT }}
          docker-version: ${{ env.DOCKER_VERSION }}

      - name: Save artifact with build results
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: |
            artifacts/${{ env.ARTIFACT }}
            artifacts/report.json
            artifacts/${{ env.ALGOLIA_ARTIFACT }}
          retention-days: 7
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: artifacts

      - name: Test documentation
        uses: JetBrains/writerside-checker-action@v1
        with:
          instance: ${{ env.INSTANCE }}

      - name: Unzip artifact
        run: unzip -O UTF-8 -qq "artifacts/${{ needs.build.outputs.artifact }}" -d dir

      - name: Verify agent-readable documentation
        working-directory: dir
        shell: bash
        run: |
          set -eu
          gas_pages=(gas?setup.html.md)
          gas_page="${gas_pages[0]}"
          grep -Fq 'integrations.html.md' llms.txt
          grep -Fq "$gas_page" llms.txt
          grep -Fq 'Integration Matrix' integrations.html.md
          grep -Eq 'integration[-_]bot[-_]combat\.html' integrations.html.md
          grep -Fq 'PublicDependencyModuleNames.AddRange' "$gas_page"
          grep -Fq 'NinjaGAS' "$gas_page"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Package and upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dir

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
  clear-index:
    needs: [build, test, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Clear Algolia Index
        env:
          ALGOLIA_KEY: ${{ secrets.ALGOLIA_KEY }}
        run: |
          if [ -z "$ALGOLIA_KEY" ]; then
            echo "ALGOLIA_KEY secret is not set in GitHub Secrets"
            exit 1
          fi

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://${ALGOLIA_APP_NAME}.algolia.net/1/indexes/${ALGOLIA_INDEX_NAME}/clear" \
            --header "X-Algolia-Application-Id: ${ALGOLIA_APP_NAME}" \
            --header "X-Algolia-API-Key: ${ALGOLIA_KEY}")

          TASK_ID=$(echo "$RESPONSE" | jq -r '.taskID')

          if [ -z "$TASK_ID" ] || [ "$TASK_ID" = "null" ]; then
            echo "Algolia did not return a task ID"
            exit 1
          fi

          for ATTEMPT in {1..120}; do
            STATUS=$(curl --fail-with-body --silent --show-error \
              --url "https://${ALGOLIA_APP_NAME}.algolia.net/1/indexes/${ALGOLIA_INDEX_NAME}/task/${TASK_ID}" \
              --header "X-Algolia-Application-Id: ${ALGOLIA_APP_NAME}" \
              --header "X-Algolia-API-Key: ${ALGOLIA_KEY}" | jq -r '.status')

            if [ "$STATUS" = "published" ]; then
              exit 0
            fi

            sleep 1
          done

          echo "Timed out waiting for Algolia to clear the index"
          exit 1
  publish-indexes:
    needs: [build, test, deploy, clear-index]
    runs-on: ubuntu-latest
    container:
      image: registry.jetbrains.team/p/writerside/builder/algolia-publisher:latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: artifacts
      - name: Unzip Algolia artifact
        run: unzip -O UTF-8 -qq "artifacts/${{ needs.build.outputs.algolia_artifact }}" -d algolia-indexes
      - name: Update Algolia Index
        run: |
          if [ -z "${{ secrets.ALGOLIA_KEY }}" ]; then
            echo "ALGOLIA_KEY secret is not set in GitHub Secrets"
            exit 1
          else
            env "algolia-key=${{ secrets.ALGOLIA_KEY }}" java -jar /opt/builder/help-publication-agent.jar \
            update-index \
            --application-name ${{ env.ALGOLIA_APP_NAME }} \
            --index-name ${{ env.ALGOLIA_INDEX_NAME }} \
            --product ${{ env.CONFIG_JSON_PRODUCT }} \
            --version ${{ env.CONFIG_JSON_VERSION }} \
            --index-directory algolia-indexes/ \
            2>&1 | tee algolia-update-index-log.txt
          fi
